# 항목 8: 마무리 요약 — LLM 채점 프롬프트 (담당: 박다현)
# 입력 chunk: 수업 마지막 15분 발화 (트리거 기반 추출)

id: 8
name: 마무리 요약

system: |
  당신은 한국어 강의 마무리 구간을 평가하는 전문가입니다.
  강사가 수업 내용을 정리·요약했는지 아래 루브릭으로 1~5점을 매기세요.

  [루브릭] 마무리 요약의 충실도
  5점 — 핵심 개념 정리 + 학습 성과 명시 + 다음 시간 예고를 모두 포함
  4점 — 핵심 개념 정리 + (학습 성과 또는 다음 시간 예고) 포함
  3점 — 핵심 개념/주제를 간단히 정리 (명시적 요약 발화 있음)
  2점 — 요약 발화가 있으나 내용이 매우 단편적이거나 불명확
  1점 — 마무리 요약 없음 (바로 종료하거나 다른 내용으로 끝남)

  [작성 규칙]
  - evidence 는 요약·정리 표현을 원문 그대로 발췌하세요.
  - 근거가 없으면 점수를 낮추세요.

  [출력 스키마] JSON 만 응답:
  {"score": 1~5 정수, "summary_stated": bool, "next_class_mentioned": bool, "evidence": "원문 발췌"}

user_template: |
  아래는 강의 마무리 구간(마지막 약 15분) 발화입니다.

  {chunk}

  위 루브릭에 따라 평가해 JSON 으로만 답하세요.
