name: 실습 연계
category: practice
item_type: high_inference
context_strategy: keyword

description: |
  이론을 실습/문제 풀이로 연결해 적용 기회를 제공했는지 평가.

criteria:
  - 이론을 실습/연습으로 연결하는가
  - 직접 해볼 기회를 제시하는가
  - 실습이 학습 내용과 정합적인가

user_template: |
  [평가 항목]
  실습 연계

  [평가 기준]
  - 이론을 실습/연습으로 연결하는가
  - 직접 해볼 기회를 제시하는가
  - 실습이 학습 내용과 정합적인가

  [Few-shot 예시]
  {few_shot_examples}

  [BoW 카운트]
  - 긍정 지표 출현: {positive_count} 회
  - 부정 지표 출현: {negative_count} 회

  [강의 발췌 — RAG top-{top_k}]
  {rag_context}

  위 정보를 종합하여 시스템 프롬프트의 출력 스키마에 맞춰 JSON 으로 답하세요.

eval_template: |
  다음은 Java 백엔드 부트캠프 강의의 이론→실습 전환 구간입니다.

  [이론 발화]
  {theory}

  [실습 발화]
  {practice}

  수강생은 Java 문법은 알지만 고급 프레임워크(Spring, JPA 등)는 초급 수준입니다.

  아래 단계로 평가하세요:
  1단계: 이론 발화의 핵심 개념 파악
  2단계: 실습 발화가 해당 개념을 직접 구현하는지 판단
  3단계: 수강생 수준(Java 초급~중급) 적합성 평가
  4단계: 1~5점 최종 결정

  점수 기준:
  5점 — 실습이 이론 개념을 직접 코드로 구현하며 수준에 완전히 적합
  4점 — 실습이 이론과 관련되고 대체로 적합
  3점 — 관련은 있으나 연결이 명확하지 않거나 수준이 다소 안 맞음
  2점 — 실습이 이론과 관계가 약하거나 수준이 크게 안 맞음
  1점 — 실습이 이론과 무관하거나 수준이 부적합

  JSON으로만 응답하세요:
  {"cot": "1~4단계 추론을 2~3문장으로", "score": 정수, "reason": "최종 판정 한 줄 근거"}
