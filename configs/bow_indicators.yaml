# ─────────────────────────────────────────────────────────────────────
# BoW 행동 태깅용 키워드 사전 (Paper #3)
# behavior_tagger.py 가 이 파일을 로드해서 각 발화 행에 태그 부착.
# 긍정 지표 카운트 ↑ → bow_score ↑
# 부정 지표 카운트 ↑ → bow_score ↓
# 1~5 정규화 후 ensemble.py에서 LLM 점수와 가중 혼합.
# ─────────────────────────────────────────────────────────────────────

indicators:
  4:  # 학습 목표 안내
    positive: ["오늘은", "이번 시간", "배울 내용", "목표", "학습할", "다룰 거"]
    negative: []

  5:  # 전날 복습 연계
    positive: ["지난", "저번", "복습", "이전에", "어제", "전 시간"]
    negative: []

  8:  # 마무리 요약
    positive: ["정리", "요약", "오늘 배운", "마무리", "정리하면"]
    negative: []

  16: # 이해 확인 질문
    positive: ["됐어요", "이해", "알겠", "맞죠", "괜찮", "물어볼 거"]
    negative: []

  17: # 참여 유도
    positive: ["해보세요", "한번 해", "직접", "여러분이", "같이 해"]
    negative: []

  18: # 질문 응답 충분성
    positive: ["좋은 질문", "질문에 대해", "답하자면", "왜냐하면", "그 이유는"]
    negative: ["글쎄요", "잘 모르", "나중에"]

  1:  # 불필요한 반복
    positive: []
    negative: ["어", "음", "그", "자", "이제", "뭐랄까"]
    # negative 카운트는 별도 규칙 (동일 단어 3회 이상 연속 시 가중)

  2:  # 발화 완결성
    positive: []
    negative: ["~인데...", "~해서...", "~그래서..."]   # 미완결 종결

  12: # 발화 속도 (preprocessor 통계 우선 사용)
    positive: []
    negative: []

# BoW 점수 정규화 규칙
# raw_score = positive_count - negative_count
# bow_score = 1 + 4 * sigmoid(raw_score / scale)
normalization:
  scale: 5.0          # raw_score 5에서 약 4점
  min_evidence: 2     # positive+negative 합이 이 미만이면 bow_score=0 (LLM 점수만 사용)
