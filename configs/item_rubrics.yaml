# 항목별 채점 루브릭 요약 (해설 생성 grounding용)
# 출처: 프로젝트 통합 문서 — 항목별 '세부 기준' + '채점 기준표'.
# explainer / narrative 가 LLM 프롬프트에 주입해 해설을 채점 근거에 정합시키는 용도.
# 각 항목: criterion(세부 기준) / high(고득점이 의미하는 것) / low(저득점이 의미하는 것).
items:
  1:
    criterion: 동일 단어·문장이나 '이제/그래서' 같은 표현을 과도하게 반복하지 않는가
    high: 불필요한 표현 비율이 낮아 군더더기 없이 전달
    low: 군더더기·담화표지가 과도해 전달이 늘어짐
  2:
    criterion: 문장을 끝까지 맺는가 (종결어미로 완결되는 발화 비율)
    high: 대부분의 발화가 문장 단위로 완결됨
    low: 말끝이 흐려지거나 연결어미로 끊기는 발화가 많음
    caveat: "발화를 문장으로 맺는 '습관/형식'만 측정한다. '내용 이해를 돕는다/방해한다'처럼 학습 이해와 인과로 엮지 말 것."
  3:
    criterion: "존댓말(높임말)을 일관되게 쓰는가 — 강의 전반에서 말투(존댓말/반말)가 한쪽으로 통일되는지만 본다"
    high: 한 가지 말투(주로 존댓말)로 강의 전반이 통일됨
    low: 존댓말과 반말이 섞여 말투가 들쭉날쭉함
    caveat: "'높임말을 일관되게 썼는지'만 보는 어조 지표다. 효과는 오직 '강사의 전문성·신뢰도'로만 서술하라 — 일관된 높임말은 강사를 더 전문적이고 신뢰감 있게 보이게 한다는 식으로. 학습자의 내용 '이해/혼란'과는 절대 엮지 말 것(말투 혼용이 이해를 방해한다는 표현 금지). 개선 방향은 '일관성을 가져야 한다/말투를 통일하라'가 아니라 '강의에서는 높임말(존댓말) 사용을 권장한다'는 투로 쓸 것(반말로 통일하라는 식은 금지)."
  4:
    criterion: 강의 시작 시 오늘의 학습 목표와 진행 순서를 명확히 안내하는가
    high: 구체적 목표(주제+결과+동기)와 진행 순서를 명시적으로 제시
    low: 학습 목표 안내가 없거나 순서가 불명확
  5:
    criterion: 이전 강의 내용을 간략히 복습하고 오늘 내용과 논리적으로 연결하는가
    high: 구체적 복습과 오늘 주제와의 관계(확장/인과/응용 등)가 명확
    low: 복습 발화가 없거나 단순 언급에 그쳐 연결이 없음
  6:
    criterion: 개념→예시→실습 순서로 구조적으로 설명하는가
    high: 설명 순서를 일관되게 유지(순서 이탈 거의 없음)
    low: 예시/실습 순서가 자주 뒤바뀌어 구조가 약함
  7:
    criterion: 중요한 내용을 반복하거나 강조하여 전달하는가
    high: 핵심을 여러 번 짚고 재강조함
    low: 강조 표현이 거의 없어 핵심이 묻힘
  8:
    criterion: 강의 마무리 시 핵심 내용을 요약 정리하는가
    high: 핵심 키워드를 연결 지어 정리된 마무리 요약 제공
    low: 요약 없이 종료하거나 형식적 마무리에 그침
  9:
    criterion: 핵심 개념을 처음 등장 시 명확하게 정의하는가
    high: 주요 개념을 정의·역할·특징까지 명확히 설명
    low: 개념을 키워드만 언급하고 정의하지 않음
  10:
    criterion: 어려운 개념에 적절한 비유나 실생활 예시를 활용하는가
    high: 예시가 개념의 핵심 원리와 직접 연결되어 이해를 도움
    low: 예시가 필요한데 제시하지 않거나 관련성이 약함
  11:
    criterion: 선행 개념 없이 갑자기 심화 내용으로 넘어가지 않는가
    high: 주제 전환 시 선행 개념을 충분히 확인하고 진행
    low: 선행 개념 확인 없이 심화로 건너뜀
  12:
    criterion: 말 속도가 적절한가 (너무 빠르거나 느리지 않은가)
    high: 적정 속도 범위를 유지하고 핵심 구간에서 감속
    low: 지나치게 빠르거나 느려 이해를 방해
  13:
    criterion: 예시가 강의 수준 및 실제 업무 현장과 연관성이 있는가
    high: 수강생 수준에 맞고 실무와 직접 연관된 예시 사용
    low: 예시가 일반적이거나 실무 연관성이 약함
  14:
    criterion: 이론 설명 후 실습으로 자연스럽게 연결되는가
    high: 이론과 실습 내용이 밀접하게 이어짐
    low: 실습이 이론과 따로 놀거나 연결 표현이 없음
  15:
    criterion: 실습 중 발생하는 오류나 질문에 적절히 대응하는가 (원인→해결→확인)
    high: 오류의 원인 설명·해결·결과 확인까지 수행
    low: 오류를 회피하거나 결과 확인 없이 넘어감
  16:
    criterion: 수강생의 이해 여부를 확인하는 질문을 적절한 빈도·타이밍으로 하는가
    high: 10~15분당 1회꼴로 이해 확인 질문을 배치
    low: 이해 확인 질문이 거의 없음
  17:
    criterion: 수강생이 직접 시도(실습)하도록 유도하고 시도 시간·결과 확인을 주는가
    high: 직접 시도를 유도하고 충분한 대기와 결과 피드백을 줌
    low: 참여 유도가 없거나 시도 시간을 주지 않음
  18:
    criterion: 질문에 충분한 길이·정보 밀도로 답했는가
    high: 질문의 핵심을 충분한 정보로 완전히 해소
    low: 질문에 표면적으로 답하거나 무시
